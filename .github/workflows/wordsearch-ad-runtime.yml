name: Word Search AdMob runtime test

on:
  push:
    branches: [test-m3-ads-on-android]
    paths: [.github/workflows/wordsearch-ad-runtime.yml, .github/wordsearch-ad-runtime-check.py]

permissions:
  contents: read
  actions: read

jobs:
  android-ad-check:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate the published debug build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: '14905973666'
          SOURCE_ARCHIVE_SHA256: '926f65a1b4ef3d94f7157e05678ae4a88c382b985e4c5f9e8a82776437b8b367'
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > verified-build.zip
          printf '%s  %s\n' "$SOURCE_ARCHIVE_SHA256" verified-build.zip | sha256sum --check
          unzip -p verified-build.zip build/outputs/apk/debug/app-debug.apk > word-search.apk
          sha256sum word-search.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt" dump --values resources word-search.apk > apk-resources.txt
          for unit in 9214589741 1033173712 5224354917; do
            grep -F "ca-app-pub-3940256099942544/$unit" apk-resources.txt
          done
      - name: Enable Android emulator acceleration
        shell: bash
        run: sudo chmod a+rw /dev/kvm
      - name: Play Word Search and check ad presentation
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: adb install word-search.apk && python3 .github/wordsearch-ad-runtime-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ad-check-android-${{ matrix.api }}
          path: ad-check/
