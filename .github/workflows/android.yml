name: Android build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and run unit tests
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease bundleRelease
      - name: Verify the Room v1 schema is unchanged
        run: git diff --exit-code -- app/schemas
      - name: Verify APK permissions
        shell: bash
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk \
            | awk -F"'" '/^uses-permission/ {print $2}' | sort -u > actual-permissions.txt
          printf '%s\n' android.permission.ACCESS_NETWORK_STATE android.permission.INTERNET com.google.android.gms.permission.AD_ID > expected-permissions.txt
          diff -u expected-permissions.txt actual-permissions.txt
      - name: Verify AdMob IDs in both APKs
        shell: bash
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          verify_ads() {
            local apk="$1" app_id="$2" banner="$3" interstitial="$4" rewarded="$5"
            "$aapt" dump xmltree "$apk" AndroidManifest.xml > ad-manifest.txt
            "$aapt" dump --values resources "$apk" > ad-resources.txt
            grep -A1 'android:name.*com.google.android.gms.ads.APPLICATION_ID' ad-manifest.txt | grep -F "$app_id"
            grep -A1 -E '^ +resource .*:string/admob_banner_id:' ad-resources.txt | grep -F "$banner"
            grep -A1 -E '^ +resource .*:string/admob_interstitial_id:' ad-resources.txt | grep -F "$interstitial"
            grep -A1 -E '^ +resource .*:string/admob_rewarded_id:' ad-resources.txt | grep -F "$rewarded"
          }
          verify_ads app/build/outputs/apk/debug/app-debug.apk \
            'ca-app-pub-3940256099942544~3347511713' 'ca-app-pub-3940256099942544/9214589741' \
            'ca-app-pub-3940256099942544/1033173712' 'ca-app-pub-3940256099942544/5224354917'
          verify_ads app/build/outputs/apk/release/app-release-unsigned.apk \
            'ca-app-pub-2899987990324695~3945516141' 'ca-app-pub-2899987990324695/3439083832' \
            'ca-app-pub-2899987990324695/6816503321' 'ca-app-pub-2899987990324695/3470873423'
      - name: Verify release manifest and bundle size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZipFile

          manifest_dir = Path("app/build/intermediates/merged_manifests/release")
          manifests = list(manifest_dir.rglob("AndroidManifest.xml"))
          assert len(manifests) == 1, f"Expected one release merged manifest, found {manifests}"
          manifest = ElementTree.parse(manifests[0]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permissions = {
              node.get(android + "name")
              for node in manifest
              if node.tag.startswith("uses-permission")
          }
          expected = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "com.google.android.gms.permission.AD_ID",
          }
          assert permissions == expected, f"Unexpected release permissions: {sorted(permissions)}"
          assert manifest.get(android + "versionCode") == "1", "Release versionCode must stay at 1"
          print("Release permissions:", ", ".join(sorted(permissions)))
          print("Release versionCode:", manifest.get(android + "versionCode"))

          bundle = Path("app/build/outputs/bundle/release/app-release.aab")
          size = bundle.stat().st_size
          assert size < 25_000_000, f"Release bundle exceeds the size target: {size:,} bytes"
          with ZipFile(bundle) as archive:
              assert "base/manifest/AndroidManifest.xml" in archive.namelist()
          print(f"Release AAB size: {size:,} bytes ({size / 1_000_000:.2f} MB)")

          reports = Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml")
          tests = sum(int(ElementTree.parse(report).getroot().attrib["tests"]) for report in reports)
          print(f"JUnit tests run: {tests}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-milestone-3
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/tests/testDebugUnitTest
            app/schemas
